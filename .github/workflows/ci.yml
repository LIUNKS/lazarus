# Continuous integration for Lazarus.
#
# Two jobs run on every pull request to develop or main and on every push to those branches:
#   check     the same three commands as a local check: `pnpm lint`, `pnpm build`, and `pnpm test`.
#   database  the Foundation suite against a disposable Postgres 17 with the Flyway CLI (`db/tests`).
#             It is the CI version of `pnpm test:db`, which starts the same database with Docker Compose.
#
# A first job, `changes`, decides whether the change is documentation only: every changed file ends in `.md` and none
# is under apps/ or packages/ (tests there read their README files). Then both jobs are skipped. GitHub reports a job
# skipped by its `if` as "Success", so the required checks still pass and the pull request can merge. Any doubt (a
# manual run, a new branch, a diff that cannot be computed, a failed `changes` job) runs both jobs.
#
# The tests need no secret and no environment variable of the real project, so the workflow is safe for pull requests
# from forks. Actions are pinned by commit SHA (the tag is in the comment), so a moved tag cannot change what runs.

name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read

# A new push to the same pull request replaces the run in progress. Runs on develop and main always finish.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  TURBO_TELEMETRY_DISABLED: '1'
  DO_NOT_TRACK: '1'

jobs:
  changes:
    name: Detect documentation-only changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.detect.outputs.code }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      # The commit ids come from the event payload through environment variables, never interpolated into the script.
      - name: Compare the changed files
        id: detect
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
        run: |
          set -uo pipefail
          code=true
          if [ "$EVENT_NAME" = "pull_request" ]; then
            base="$PR_BASE"; head="$PR_HEAD"; range="$base...$head"
          elif [ "$EVENT_NAME" = "push" ]; then
            base="$PUSH_BEFORE"; head="$PUSH_AFTER"; range="$base..$head"
          else
            base=""; head=""; range=""
          fi
          if [ -n "$base" ] && [ "$base" != "0000000000000000000000000000000000000000" ] \
            && git cat-file -e "$base^{commit}" 2>/dev/null && git cat-file -e "$head^{commit}" 2>/dev/null; then
            if files="$(git diff --name-only "$range")" && [ -n "$files" ]; then
              echo "Changed files:"; echo "$files"
              if ! printf '%s\n' "$files" | grep -Ev '\.md$' | grep -q . \
                && ! printf '%s\n' "$files" | grep -Eq '^(apps|packages)/'; then
                code=false
              fi
            fi
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "Run lint, build, test, and the database tests: $code"

  check:
    name: Lint, build, and test
    needs: changes
    # Runs unless `changes` reported a documentation-only change. A failed `changes` job leaves the output empty, so
    # this job still runs.
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The pnpm version comes from `packageManager` in package.json.
      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          cache: true

      # `engines.node` of package.json asks for Node.js 24 or newer.
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build

      # The packages are built, so Turborepo runs every test task. A fresh runner has no Turborepo cache to replay.
      - name: Test
        run: pnpm test

  database:
    name: Database tests
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: lazarus_local
          POSTGRES_DB: lazarus_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d lazarus_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      # Same credentials as db/local/docker-compose.yml. The password is for a throwaway database that lives only in this job.
      TEST_DATABASE_URL: postgresql://postgres:lazarus_local@localhost:5432/lazarus_test
      FLYWAY_VERSION: 13.12.1
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The Linux x64 archive includes its own Java runtime. The .sha1 file comes from the same server as the archive, so it
      # detects a damaged or cut download. It does not prove who published the file.
      - name: Install the Flyway CLI
        run: |
          set -euo pipefail
          base="https://download.red-gate.com/maven/release/com/redgate/flyway/flyway-commandline/${FLYWAY_VERSION}"
          file="flyway-commandline-${FLYWAY_VERSION}-linux-x64.tar.gz"
          curl --fail --silent --show-error --location --retry 3 --output "${RUNNER_TEMP}/${file}" "${base}/${file}"
          curl --fail --silent --show-error --location --retry 3 --output "${RUNNER_TEMP}/${file}.sha1" "${base}/${file}.sha1"
          echo "$(cat "${RUNNER_TEMP}/${file}.sha1")  ${RUNNER_TEMP}/${file}" | sha1sum --check -
          mkdir -p "${HOME}/flyway"
          tar --extract --gzip --file "${RUNNER_TEMP}/${file}" --strip-components=1 --directory "${HOME}/flyway"
          rm -f "${RUNNER_TEMP}/${file}" "${RUNNER_TEMP}/${file}.sha1"
          echo "${HOME}/flyway" >> "${GITHUB_PATH}"

      - name: Show the Flyway version
        run: flyway -v

      # The root Vitest configuration runs only db/tests. With TEST_DATABASE_URL set, the database tests are not skipped.
      - name: Run the database tests
        run: pnpm exec vitest run

# Disposable Postgres for the Verification_Suite (pnpm test:db).
# The data lives in memory (tmpfs), so `docker compose down` resets everything.
# Never use this database for real data.
name: lazarus-test-db
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: lazarus_local
      POSTGRES_DB: lazarus_test
    ports:
      - "127.0.0.1:54329:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d lazarus_test"]
      interval: 2s
      timeout: 3s
      retries: 30

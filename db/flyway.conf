# Flyway configuration for Lazarus.
# Connection settings (URL, user, password) are never stored here.
# Flyway reads them from the environment; `pnpm db:migrate` loads them from `.env`.
# Use the Direct connection or the Session Pooler. Flyway needs session-level advisory locks.
flyway.locations=db/migrations
flyway.validateOnMigrate=true
flyway.cleanDisabled=true
# The migrations contain literal dollar-brace sequences inside quoted source code, so placeholder replacement is off.
flyway.placeholderReplacement=false
